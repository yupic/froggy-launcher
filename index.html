<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#245c44">
  <meta name="description" content="Pick a spot on the world map and launch Froggy's World with its coordinates.">
  <title>Froggy — Pick a place</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <p id="local-warning" role="note" hidden>This page was opened as a file. OSM may block map tiles (403). Run start-local.cmd from the app folder or open the site on GitHub Pages.</p>
    <div class="heading"><span class="frog" aria-hidden="true">🐸</span><div><h1>Where will Froggy go?</h1><p>Pick a place on the map and open the game.</p></div></div>
    <details>
      <summary>Enter coordinates</summary>
      <form id="coordinates">
        <label>Latitude<input id="latitude" type="text" inputmode="decimal" placeholder="59.9386" required autocomplete="off"></label>
        <label>Longitude<input id="longitude" type="text" inputmode="decimal" placeholder="30.3141" required autocomplete="off"></label>
        <button type="submit">Show</button>
      </form>
    </details>
  </header>
  <main id="map" aria-label="World map. Click or tap the map to pick a spot."></main>
  <div id="status" role="status" aria-live="polite">Click or tap the map to pick a spot.</div>
  <noscript><div class="no-script">Enable JavaScript in your browser to use the map.</div></noscript>
</body>
</html>
